name: CD

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - beta
          - stable
      legacy_final_note:
        description: "One-time: also publish the FINAL better-telegram-mcp release at the same version (rename note) before the old PyPI project freezes. Set true only on the first n24q02m-telegram release."
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write

env:
  # Release lane: dispatch-only (release_type=beta, then stable); a push never releases.
  RELEASE_TYPE: ${{ inputs.release_type }}
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/telegram
  # Derived from the repository slug, so the rename to n24q02m/telegram makes
  # this ghcr.io/n24q02m/telegram with no literal to keep in sync.
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  readme-sync:
    name: Verify README registry metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Verify README registry metadata
        run: python scripts/repo-bootstrap/verify_readme_sync.py --repo-root=.

  # =================== Release ===================
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      # Dry-run PSR (no_operation_mode => --noop: no commit/tag/push/release) purely to
      # learn the version it WOULD publish, so the PyPI-collision guard below can fire
      # BEFORE the real run creates a git tag or GitHub Release. Same action + SHA and
      # same prerelease inputs as the real step, run against the same untouched checkout,
      # so the computed version is identical.
      - uses: n24q02m/better-semantic-release@6e6884898bfe1ac34a0bc64ed62f54a21562df23 # v1.6.1
        id: dryrun
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          prerelease: ${{ env.RELEASE_TYPE == 'beta' }}
          prerelease_token: beta
          no_operation_mode: true

      # PSR silently no-ops when it can't find a fix:/feat: commit since the last
      # tag -- e.g. a bot PR squash-merged with a non-conventional subject (the
      # commit-title no-bump trap the pr-title CI check guards at merge time; this
      # step is the release-time backstop for anything that slipped past it, or a
      # repo predating that check). released=false alone is not an error (it is
      # the normal outcome of a docs-only/chore-only window), so this only warns.
      - name: Warn if commits exist since last tag but PSR computed no release
        if: steps.dryrun.outputs.released != 'true'
        run: |
          set -uo pipefail
          highest_tag="$(git tag -l 'v*' | sort -V | tail -1)"
          if [ -z "$highest_tag" ]; then
            echo "No existing tags -- nothing to compare."
            exit 0
          fi
          commit_count="$(git rev-list "${highest_tag}..HEAD" --count)"
          if [ "$commit_count" -gt 0 ]; then
            echo "::warning::PSR computed no release (released=false) but ${commit_count} commit(s) exist since ${highest_tag}. This is expected if they are all chore/docs-only, but if one of them should have bumped the version (e.g. a bot-authored fix squashed with a non-conventional subject), inspect 'git log ${highest_tag}..HEAD --oneline' before assuming there is nothing to release."
          else
            echo "OK: no commits since ${highest_tag} -- released=false is expected."
          fi

      # Fail early and loudly if the version PSR intends to publish already exists on
      # PyPI. PyPI never allows reusing a version number, so a hit here means the git
      # history has diverged from the registry. Catching it here converts two nasty
      # failure modes -- PSR silently setting released=false on a matching tag (every
      # publish job skipped) and an opaque PyPI 400 deep inside `uv publish` -- into one
      # explicit, actionable error, before any tag or Release is created.
      - name: Guard against re-publishing an already-published PyPI version
        if: steps.dryrun.outputs.released == 'true'
        env:
          COMPUTED_VERSION: ${{ steps.dryrun.outputs.version }}
        run: |
          set -uo pipefail
          PKG='n24q02m-telegram'
          URL="https://pypi.org/pypi/${PKG}/${COMPUTED_VERSION}/json"
          echo "Checking PyPI for ${PKG} ${COMPUTED_VERSION} before semantic-release tags anything..."

          # PyPI JSON API for a specific release (behaviour verified live, unauthenticated):
          #   200                 -> the version EXISTS  -> COLLISION
          #   404                 -> the version is FREE -> proceed
          #   empty/000/anything else -> UNKNOWN (network, 5xx, 429, curl failure) -> refuse
          # A transient error must NEVER be read as "free": that could let a real
          # collision slip through, which is worse than the bug this guard prevents.
          status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "${URL}" 2>/dev/null)"

          if [ "${status}" = "200" ]; then
            echo "::error::Computed release version ${COMPUTED_VERSION} already exists on PyPI as ${PKG} ${COMPUTED_VERSION} (${URL} returned 200). PyPI NEVER allows re-publishing a version number, even one later yanked. This almost always means the git history diverged from what was published to PyPI -- tags/commits were rewritten while the registry kept the original releases. Do NOT retry the same version: bump PAST the already-published range (higher than any version ever published) and dispatch the release again."
            exit 1
          fi

          if [ "${status}" = "404" ]; then
            echo "OK: ${PKG} ${COMPUTED_VERSION} is not on PyPI (404) -- safe to publish."
            exit 0
          fi

          echo "::error::Could not verify whether ${PKG} ${COMPUTED_VERSION} exists on PyPI: ${URL} returned HTTP '${status:-<no response>}' (expected 200 or 404). Refusing to proceed so a genuine collision cannot slip through as a false 'free'. Re-run the release once the registry is reachable."
          exit 1

      - uses: n24q02m/better-semantic-release@6e6884898bfe1ac34a0bc64ed62f54a21562df23 # v1.6.1
        id: release
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          prerelease: ${{ env.RELEASE_TYPE == 'beta' }}
          prerelease_token: beta

      - uses: python-semantic-release/publish-action@6d89e2de8d40ecb3717316ecbbf15a6fa8ea9039 # v10.6.2
        if: steps.release.outputs.released == 'true'
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          tag: ${{ steps.release.outputs.tag }}

  # =================== Publish to PyPI ===================
  publish-pypi:
    name: Publish to PyPI
    needs: [readme-sync, release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv build
      - name: Publish to PyPI
        run: uv publish

  # ============================================================================
  # One-time legacy final-note: publish the LAST better-telegram-mcp release at
  # the same version as the first n24q02m-telegram release, with a rename note,
  # then the old PyPI project freezes. Rebuilds the wheel/sdist under the old
  # distribution name from the same tag (same `telegram` import package and the
  # same console scripts, so `uvx better-telegram-mcp` keeps working; only the
  # project name + description change). Gated by the legacy_final_note dispatch input so
  # it runs exactly once. PyPI trusted publishing (OIDC) like publish-pypi: no
  # token; the old project's trusted publisher must point at this repo before
  # the dispatch.
  # ============================================================================
  publish-pypi-legacy-final:
    name: Publish better-telegram-mcp final rename note
    needs: release
    if: >-
      inputs.legacy_final_note
      && needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Rewrite project name back to better-telegram-mcp with rename note
        run: |
          python3 - <<'EOF'
          import pathlib
          import re
          import tomllib

          path = pathlib.Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          project = tomllib.loads(text)["project"]
          if project["name"] != "n24q02m-telegram":
              raise SystemExit(f"expected renamed project, got {project['name']!r}")
          note = (
              " [FINAL release under this name: package renamed to"
              " n24q02m-telegram -- migrate with: uvx n24q02m-telegram]"
          )
          text, n_name = re.subn(
              r'(?m)^name = "n24q02m-telegram"$', 'name = "better-telegram-mcp"', text, count=1
          )
          text, n_desc = re.subn(
              r'(?m)^(description = ".*)"$', lambda m: m.group(1) + note + '"', text, count=1
          )
          if n_name != 1 or n_desc != 1:
              raise SystemExit(f"rewrite failed: name={n_name} description={n_desc}")
          path.write_text(text, encoding="utf-8")
          rewritten = tomllib.loads(text)["project"]
          assert rewritten["name"] == "better-telegram-mcp", rewritten["name"]
          assert rewritten["description"].endswith(note), rewritten["description"]
          print("rewritten")
          EOF
          head -5 pyproject.toml

      - run: uv build
      - name: Verify the built distribution name
        run: |
          ls dist
          ls dist/better_telegram_mcp-*.whl dist/better_telegram_mcp-*.tar.gz
      - name: Publish final better-telegram-mcp to PyPI
        run: uv publish

  # =================== Build Docker ===================
  build-docker:
    name: Build Docker (${{ matrix.platform }})
    needs: [readme-sync, release]
    if: needs.release.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            artifact: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=${{ env.DOCKERHUB_IMAGE }},${{ env.GHCR_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ github.ref_name }}-${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}-${{ matrix.artifact }}
      - run: |
          mkdir -p ${{ runner.temp }}/digests
          echo "${{ steps.build.outputs.digest }}" > "${{ runner.temp }}/digests/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  # =================== Merge Docker Manifests ===================
  merge-docker:
    name: Merge Docker Manifests
    needs: [release, build-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifests
        env:
          VERSION: ${{ needs.release.outputs.version }}
          IS_PRERELEASE: ${{ needs.release.outputs.is_prerelease }}
        run: |
          # Build tag lists based on release type
          if [ "$IS_PRERELEASE" = "true" ]; then
            TAGS="beta ${VERSION}"
          else
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f1-2)
            TAGS="latest ${VERSION} ${MINOR} ${MAJOR}"
          fi

          DIGESTS=$(cat ${{ runner.temp }}/digests/*)

          for IMAGE in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
            TAG_ARGS=""
            for TAG in $TAGS; do
              TAG_ARGS="$TAG_ARGS -t ${IMAGE}:${TAG}"
            done
            docker buildx imagetools create $TAG_ARGS \
              $(echo "$DIGESTS" | xargs -I{} echo "${IMAGE}@{}")
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: README.md
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/telegram
          short-description: ${{ github.event.repository.description }}
          readme-filepath: ./README.md

  # =================== Publish to MCP Registry ===================
  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: [release, publish-pypi, merge-docker]
    if: needs.release.outputs.released == 'true' && needs.release.outputs.is_prerelease != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Update server.json version
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          jq --arg v "$VERSION" '
            .version = $v |
            .packages = [.packages[] |
              if .registryType == "oci" then del(.version)
              else .version = $v
              end
            ]
          ' server.json > server.json.tmp && mv server.json.tmp server.json

      - name: Install MCP Publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Validate MCP Registry manifest
        run: ./mcp-publisher validate server.json

      - name: Login to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

  # ============================================================================
  # Sync to Plugin Marketplace
  # ============================================================================
  sync-marketplace:
    name: Sync to Marketplace
    needs: [release, publish-mcp-registry]
    if: needs.release.outputs.released == 'true' && needs.release.outputs.is_prerelease != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_KEY }}
          repositories: claude-plugins

      - name: Dispatch plugin sync
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh api repos/n24q02m/claude-plugins/dispatches \
            -f event_type=plugin-sync \
            -f 'client_payload[repo]=telegram' \
            -f 'client_payload[tag]=${{ needs.release.outputs.tag }}'
