# HTTP mode overlay — use with:
# docker compose -f docker-compose.yml -f docker-compose.http.yml up
# The server reads /home/appuser/.telegram/config.toml; set auth = "token" or
# "multi" there, because "no-auth" refuses the container's non-loopback bind.
services:
  telegram:
    environment:
      - TRANSPORT_MODE=http
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - telegram-data:/data
volumes:
  telegram-data:
